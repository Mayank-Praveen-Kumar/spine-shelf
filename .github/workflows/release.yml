name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable app
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipPortable
      - name: Check install and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $target = Join-Path $env:RUNNER_TEMP ('SpineShelf-test-' + [guid]::NewGuid())
          $target = [IO.Path]::GetFullPath($target)
          if (!$target.StartsWith([IO.Path]::GetFullPath($env:RUNNER_TEMP) + [IO.Path]::DirectorySeparatorChar)) { throw 'Test path is outside runner temporary directory.' }
          $setup = (Resolve-Path "release/SpineShelf-$version-Setup-x64.exe").Path
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', '/TASKS=', ('/DIR="' + $target + '"'))
          foreach ($phase in @('install', 'reinstall')) {
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0,3010)) { throw "Installer failed during $phase with exit code $($process.ExitCode)." }
            if (!(Test-Path -LiteralPath (Join-Path $target 'SpineShelf.exe'))) { throw 'Installed executable is missing.' }
            if (!(Test-Path -LiteralPath (Join-Path $target 'python/python.exe'))) { throw 'Embedded Python is missing.' }
          }
          $sentinel = Join-Path $target 'keep-personal-file.txt'
          Set-Content -LiteralPath $sentinel -Value 'Keep this user-created file.'
          $uninstall = Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed.' }
          if (Test-Path -LiteralPath (Join-Path $target 'SpineShelf.exe')) { throw 'Uninstall left the app executable behind.' }
          if (!(Test-Path -LiteralPath $sentinel)) { throw 'Uninstall deleted a user-created file.' }
      - uses: actions/upload-artifact@v4
        with:
          name: SpineShelf-Windows
          path: |
            release/*.zip
            release/*Setup*.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME release/*.zip release/*Setup*.exe --clobber
